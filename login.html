<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Masuk — ApprovalSim</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
</head>
<body class="auth-page">
  <div class="auth-container fade-in">
    <div class="auth-card">
      <a href="index.html" class="logo auth-logo">
        <span class="logo-mark">A</span>
        <span class="logo-text">Approval<em>Sim</em></span>
      </a>
      <h1>Selamat Datang Kembali</h1>
      <p class="auth-sub">Masuk untuk mulai jual beli dengan aman.</p>
      <form id="loginForm">
        <div class="input-group">
          <label for="email">Email</label>
          <input type="email" id="email" placeholder="nama@email.com" required>
        </div>
        <div class="input-group">
          <label for="password">Kata Sandi</label>
          <input type="password" id="password" placeholder="••••••••" required>
        </div>
        <button type="submit" class="btn btn-primary btn-full">Masuk</button>
      </form>
      <p class="auth-footer">Belum punya akun? <a href="register.html">Daftar sekarang</a></p>
      <p id="message" class="auth-message"></p>
    </div>
  </div>
  <script src="script.js"></script>
</body>
</html>
