<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daftar — ApprovalSim</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body class="auth-page">

  <div class="auth-container fade-in">
    <div class="auth-card">
      <a href="index.html" class="logo auth-logo">
        <span class="logo-mark">A</span>
        <span class="logo-text">Approval<em>Sim</em></span>
      </a>
      
      <h1>Buat Akun Baru</h1>
      <p class="auth-sub">Bergabung dan mulai jual beli barang impianmu.</p>

      <form id="registerForm">
        <div class="input-group">
          <label for="name">Nama Lengkap</label>
          <input type="text" id="name" placeholder="Nama Anda" required>
        </div>
        <div class="input-group">
          <label for="email">Email</label>
          <input type="email" id="email" placeholder="nama@email.com" required>
        </div>
        <div class="input-group">
          <label for="password">Kata Sandi (min. 6 karakter)</label>
          <input type="password" id="password" placeholder="••••••••" required>
        </div>
        <button type="submit" class="btn btn-primary btn-full">Daftar</button>
      </form>

      <p class="auth-footer">
        Sudah punya akun? <a href="login.html">Masuk di sini</a>
      </p>
      <p id="message" class="auth-message"></p>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
